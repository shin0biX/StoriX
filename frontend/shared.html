<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared file — StoriX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css?v=8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-bg-glow"></div>
        <div class="auth-bg-glow two"></div>

        <div>
            <div class="flex justify-center mb-6">
                <a href="/" class="logo text-xl"><span class="logo-mark" id="logo-mark"></span>StoriX</a>
            </div>

            <div class="auth-card text-center">
                <div class="empty-state" style="padding:8px 0 18px">
                    <div class="empty-icon" id="share-icon" style="margin:0 auto 14px;width:56px;height:56px;border-radius:16px"></div>
                    <h3 id="status-title" style="font-size:17px">Shared file</h3>
                    <p id="status-message" role="status" aria-live="polite" style="margin-top:4px">Preparing your secure download…</p>
                </div>
                <button id="download-btn" class="btn btn-primary w-full" style="padding:11px;display:none">
                    <span id="dl-ic"></span> Download file
                </button>
                <p class="text-dim text-[12px] mt-4 mb-0">Links expire automatically — this one is time-limited by the sender.</p>
            </div>
        </div>
    </div>

    <script src="/js/ui.js?v=4"></script>
    <script src="/js/api.js?v=3"></script>
    <script>
        document.getElementById('logo-mark').innerHTML = icon('logo');
        document.getElementById('share-icon').innerHTML = icon('share');
        document.getElementById('dl-ic').innerHTML = icon('download');

        const statusTitle = document.getElementById('status-title');
        const statusMsg = document.getElementById('status-message');
        const downloadBtn = document.getElementById('download-btn');

        // Share URLs are always /shared.html?token=…; never treat a path
        // segment as a token, because /shared.html itself would then look
        // like one.
        const token = new URLSearchParams(window.location.search).get('token');

        if (!token) {
            statusTitle.textContent = 'Invalid link';
            statusMsg.textContent = 'This share link is missing its token.';
            statusMsg.style.color = 'var(--danger)';
        } else {
            statusMsg.textContent = 'Your download is ready. Click below to save the file.';
            downloadBtn.style.display = 'inline-flex';
        }

        downloadBtn.addEventListener('click', async () => {
            downloadBtn.disabled = true;
            statusMsg.style.color = 'var(--text-2)';
            statusMsg.textContent = 'Downloading…';
            try {
                const res = await fetch(`/files/shared/${encodeURIComponent(token)}`, {
                    headers: { Accept: 'application/octet-stream' },
                });
                if (!res.ok) {
                    let detail = res.status === 401
                        ? 'This link has expired.'
                        : res.status === 403
                            ? 'Sharing is no longer available for this file.'
                            : 'This link is invalid or the file was removed.';
                    try {
                        const body = await res.json();
                        if (body && typeof body.detail === 'string') detail = body.detail;
                    } catch {}
                    throw new Error(detail);
                }
                const blob = await res.blob();
                const filename = parseDispositionFilename(res.headers.get('content-disposition')) || 'shared-file';
                saveBlob(blob, filename);
                statusTitle.textContent = 'Downloaded';
                statusMsg.style.color = 'var(--accent)';
                statusMsg.textContent = `${filename} saved to your device.`;
            } catch (err) {
                statusTitle.textContent = 'Download failed';
                statusMsg.style.color = 'var(--danger)';
                statusMsg.textContent = err.message;
            } finally {
                downloadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

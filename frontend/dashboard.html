<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace — StoriX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            bg: '#0d0d0f', surface: '#151518', elevated: '#1b1b20',
            ink: '#f5f5f5', mut: '#92929b', dim: '#5f5f6b',
            line: 'rgba(255,255,255,0.07)', lineS: 'rgba(255,255,255,0.13)', acc: '#34d399',
        }}}}
    </script>
    <link rel="stylesheet" href="/css/app.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="nav-section" style="padding:18px 16px 10px">
            <a href="/" class="logo text-[17px]"><span class="logo-mark" id="logo-mark"></span>StoriX</a>
        </div>

        <nav class="nav-section">
            <button class="nav-item active" data-view="files" id="nav-files"><span class="nav-ic" data-ic="files"></span>My Files</button>
            <button class="nav-item" data-view="recent"><span class="nav-ic" data-ic="clock"></span>Recent</button>
            <button class="nav-item" data-view="shared"><span class="nav-ic" data-ic="globe"></span>Shared<span class="nav-count" id="nav-count-shared"></span></button>
            <button class="nav-item" data-view="starred"><span class="nav-ic" data-ic="star"></span>Starred<span class="nav-count" id="nav-count-starred"></span></button>
            <button class="nav-item" data-view="trash"><span class="nav-ic" data-ic="trash"></span>Trash<span class="nav-count" id="nav-count-trash"></span></button>
            <button class="nav-item" data-goto="/admin.html" id="nav-admin" style="display:none"><span class="nav-ic" data-ic="users"></span>Admin</button>
        </nav>

        <div style="flex:1"></div>

        <!-- Storage meter -->
        <div class="storage-meter">
            <div class="flex items-center justify-between text-[12px]">
                <span class="text-mut font-medium" style="display:inline-flex;align-items:center;gap:6px"><span data-ic="drive" style="display:inline-flex"></span>Storage</span>
                <span id="sb-plan-badge" class="badge">—</span>
            </div>
            <div class="storage-bar-track"><div class="storage-bar-fill" id="sb-bar" style="width:0%"></div></div>
            <div class="flex items-center justify-between text-[11.5px] text-dim mono">
                <span id="sb-used">0 B</span>
                <span id="sb-limit">0 B</span>
            </div>
            <button class="btn btn-sm w-full mt-3" id="btn-upgrade"><span data-ic="zap"></span>Change plan</button>
        </div>

        <!-- User -->
        <div class="nav-section" style="border-top:1px solid var(--border);padding:12px 16px">
            <div class="flex items-center gap-3">
                <div id="sb-avatar" style="width:32px;height:32px;border-radius:999px;background:var(--elevated);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--accent);flex:none">—</div>
                <div style="min-width:0;flex:1">
                    <div id="sb-username" class="text-[13px] font-medium" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Loading…</div>
                    <div class="text-[11px] text-dim" id="sb-plan-name"></div>
                </div>
                <button class="icon-action" id="btn-logout" title="Log out" data-ic="logout"></button>
            </div>
        </div>
    </aside>
    <div class="sidebar-scrim" id="scrim"></div>

    <!-- Main -->
    <div class="app-main">
        <div class="topbar">
            <button class="btn btn-ghost btn-icon sidebar-toggle" id="btn-menu" data-ic="menu"></button>
            <div class="search-box" style="width:min(380px,100%)">
                <span data-ic="search"></span>
                <input class="input" id="search-input" type="text" placeholder="Search files…" autocomplete="off">
                <kbd>/</kbd>
            </div>
            <div style="flex:1"></div>
            <button class="btn btn-primary" id="btn-upload"><span data-ic="upload"></span>Upload</button>
        </div>

        <div class="content-scroll">
            <!-- Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                <div>
                    <h1 class="font-semibold" style="font-size:21px;margin:0" id="view-title">My Files</h1>
                    <p class="text-dim text-[12.5px] m-0 mt-0.5" id="view-sub"></p>
                </div>
                <div class="flex items-center gap-2" id="toolbar-main">
                    <select class="select" id="sort-select" style="width:auto;padding:7px 30px 7px 12px">
                        <option value="date-desc">Newest first</option>
                        <option value="date-asc">Oldest first</option>
                        <option value="name">Name A–Z</option>
                        <option value="size-desc">Largest first</option>
                        <option value="size-asc">Smallest first</option>
                    </select>
                    <button class="btn btn-icon" id="btn-view-mode" title="Toggle grid / list view"></button>
                </div>
            </div>

            <!-- Breadcrumbs / folder row -->
            <div class="flex items-center justify-between gap-3 mb-4 flex-wrap" id="crumb-row">
                <div class="crumbs" id="crumbs"></div>
                <div class="flex items-center gap-2">
                    <button class="btn btn-sm" id="btn-new-folder"><span data-ic="folderPlus"></span>New folder</button>
                    <button class="btn btn-sm btn-danger" id="btn-empty-trash" style="display:none"><span data-ic="trash"></span>Empty trash</button>
                </div>
            </div>

            <!-- Bulk bar -->
            <div class="panel flex items-center gap-3 px-4 py-2.5 mb-4" id="bulk-bar" style="display:none">
                <span class="text-[13px]"><span id="bulk-count" class="font-semibold"></span> selected</span>
                <div style="flex:1"></div>
                <button class="btn btn-sm" id="btn-bulk-zip"><span data-ic="download"></span>Download as ZIP</button>
                <button class="btn btn-sm btn-danger" id="btn-bulk-delete"><span data-ic="trash"></span>Delete</button>
                <button class="btn btn-sm btn-ghost" id="btn-bulk-clear">Clear</button>
            </div>

            <!-- Storage by type -->
            <div class="panel px-5 py-4 mb-5" id="type-breakdown" style="display:none"></div>

            <!-- Dropzone -->
            <div class="dropzone mb-5" id="dropzone">
                <span style="display:inline-flex" data-ic="upload"></span>
                <p class="m-0 text-[13.5px]"><span class="font-medium" style="color:var(--text)">Drop files here</span> or click to browse — multiple files supported</p>
                <p class="m-0 text-[11.5px] mt-1" id="dz-hint"></p>
                <input type="file" id="file-input" multiple style="display:none">
            </div>

            <!-- Browser -->
            <div id="browser" class="panel view-fade" style="min-height:280px;overflow:hidden"></div>
        </div>
    </div>
</div>

<!-- Upload manager -->
<div class="upload-panel" id="upload-panel" style="display:none">
    <div class="up-head">
        <span id="upload-title">Uploading…</span>
        <button class="icon-action" id="btn-upload-close" style="display:none" data-ic="x"></button>
    </div>
    <div id="upload-list" style="max-height:280px;overflow-y:auto"></div>
</div>

<!-- Share modal -->
<div class="modal-backdrop" id="modal-share">
    <div class="modal" style="max-width:460px">
        <div class="modal-head"><h3>Share file</h3><button class="btn btn-ghost btn-icon" data-close data-ic="x"></button></div>
        <div class="modal-body">
            <label class="field-label">Link expires in</label>
            <select class="select mb-4" id="share-expiry">
                <option value="30">30 minutes</option>
                <option value="60">1 hour</option>
                <option value="1440">24 hours</option>
            </select>
            <label class="field-label">Share link</label>
            <div class="flex gap-2">
                <input class="input mono" id="share-link-input" readonly placeholder="Create a link to continue">
                <button class="btn btn-icon" id="btn-copy-link" title="Copy" data-ic="copy"></button>
            </div>
            <p class="text-dim text-[12px] mt-2.5 m-0" id="share-file-name"></p>
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" data-close>Close</button>
            <button class="btn btn-primary" id="btn-create-link"><span data-ic="link"></span>Create link</button>
        </div>
    </div>
</div>

<!-- Rename modal -->
<div class="modal-backdrop" id="modal-rename">
    <div class="modal" style="max-width:400px">
        <div class="modal-head"><h3>Rename</h3><button class="btn btn-ghost btn-icon" data-close data-ic="x"></button></div>
        <div class="modal-body">
            <label class="field-label">New name</label>
            <input class="input" id="rename-input" autocomplete="off">
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" data-close>Cancel</button>
            <button class="btn btn-primary" id="btn-rename-save">Rename</button>
        </div>
    </div>
</div>

<!-- Move modal -->
<div class="modal-backdrop" id="modal-move">
    <div class="modal" style="max-width:400px">
        <div class="modal-head"><h3>Move file</h3><button class="btn btn-ghost btn-icon" data-close data-ic="x"></button></div>
        <div class="modal-body">
            <label class="field-label">Destination folder</label>
            <select class="select" id="move-select"></select>
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" data-close>Cancel</button>
            <button class="btn btn-primary" id="btn-move-save">Move</button>
        </div>
    </div>
</div>

<!-- New folder modal -->
<div class="modal-backdrop" id="modal-folder">
    <div class="modal" style="max-width:400px">
        <div class="modal-head"><h3>New folder</h3><button class="btn btn-ghost btn-icon" data-close data-ic="x"></button></div>
        <div class="modal-body">
            <label class="field-label">Folder name</label>
            <input class="input" id="folder-name-input" placeholder="e.g. Projects" autocomplete="off">
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" data-close>Cancel</button>
            <button class="btn btn-primary" id="btn-folder-save">Create</button>
        </div>
    </div>
</div>

<!-- Plan modal -->
<div class="modal-backdrop" id="modal-plan">
    <div class="modal" style="max-width:760px">
        <div class="modal-head"><h3>Choose your plan</h3><button class="btn btn-ghost btn-icon" data-close data-ic="x"></button></div>
        <div class="modal-body">
            <div class="grid md:grid-cols-3 gap-4" id="plan-grid"></div>
            <p class="text-center text-[12.5px] mt-4 mb-0" id="plan-status"></p>
        </div>
    </div>
</div>

<!-- Preview modal -->
<div class="modal-backdrop" id="modal-preview">
    <div class="modal" style="max-width:860px;height:calc(100vh - 60px)">
        <div class="modal-head">
            <h3 id="preview-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%"></h3>
            <div class="flex items-center gap-2">
                <button class="btn btn-sm" id="btn-preview-download"><span data-ic="download"></span>Download</button>
                <button class="btn btn-ghost btn-icon" data-close data-ic="x"></button>
            </div>
        </div>
        <div class="preview-stage" id="preview-stage"></div>
    </div>
</div>

<!-- Versions modal -->
<div class="modal-backdrop" id="modal-versions">
    <div class="modal" style="max-width:480px">
        <div class="modal-head"><h3 id="versions-title">Version history</h3><button class="btn btn-ghost btn-icon" data-close data-ic="x"></button></div>
        <div class="modal-body" id="versions-list" style="padding:10px"></div>
    </div>
</div>

<script src="/js/ui.js?v=3"></script>
<script src="/js/api.js?v=2"></script>
<script src="/js/dashboard.js?v=6"></script>
</body>
</html>
